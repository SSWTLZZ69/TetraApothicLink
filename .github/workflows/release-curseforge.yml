name: Release to CurseForge

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version already recorded in gradle.properties'
        required: true
        default: '0.2.0-alpha.1'
      game_versions:
        description: 'Legacy CurseForge game-version names (not Core API IDs)'
        required: true
        default: '1.20.1,Forge,Java 17'
      release_type:
        description: 'auto derives alpha/beta/release from version'
        required: true
        default: 'auto'
        type: choice
        options: [auto, alpha, beta, release]
      dry_run:
        description: 'Prepare artifact and metadata only; do not upload'
        required: true
        default: true
        type: boolean
      create_github_release:
        description: 'Also create a GitHub Release, only after a real CurseForge upload'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: curseforge-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.plan.outputs.sha256 }}
      filename: ${{ steps.plan.outputs.filename }}
      release_type: ${{ steps.plan.outputs.release_type }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify requested version and release tools
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          actual = dict(line.split('=', 1) for line in pathlib.Path('gradle.properties').read_text().splitlines() if '=' in line)['mod_version']
          if os.environ['VERSION'] != actual:
              raise SystemExit('Requested version does not match gradle.properties')
          PY
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Build and test normal runtime
        run: bash ./gradlew clean test build --console=plain
      - name: Preserve normal-runtime test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-normal-${{ inputs.version }}
          path: build/reports/tests/test
      - name: Test without Tetrawear
        run: bash ./gradlew -PwithoutTetrawear=true test --rerun-tasks --console=plain
      - name: Prepare offline upload plan
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          GAME_VERSIONS: ${{ inputs.game_versions }}
        run: |
          JAR="build/libs/tetra_apothic_link-${VERSION}.jar"
          python3 scripts/curseforge_release.py --version "$VERSION" --jar "$JAR" --release-type "$RELEASE_TYPE" --game-versions "$GAME_VERSIONS"
          python3 - <<'PY'
          import json, os, pathlib
          plan = json.loads(pathlib.Path('build/release/curseforge-plan.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha256=' + plan['sha256'] + '\n')
              output.write('filename=' + pathlib.Path(plan['artifact']).name + '\n')
              output.write('release_type=' + plan['metadata']['releaseType'] + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## CurseForge release plan\n\n')
              summary.write('Project: **1653941**\n\n')
              summary.write('Type: **' + plan['metadata']['releaseType'] + '**\n\n')
              summary.write('SHA-256: `' + plan['sha256'] + '`\n\n')
              summary.write('Tetrawear: **optionalDependency**. A dry run never reads the publishing secret or uploads.\n')
          PY
      - name: Upload exact prepared artifact
        uses: actions/upload-artifact@v4
        with:
          name: curseforge-prepared-${{ inputs.version }}
          path: |
            build/libs/tetra_apothic_link-${{ inputs.version }}.jar
            build/release/curseforge-plan.json
          if-no-files-found: error
      - name: Preserve without-Tetrawear test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-without-tetrawear-${{ inputs.version }}
          path: build/reports/tests/test

  publish:
    if: ${{ !inputs.dry_run }}
    needs: prepare
    runs-on: ubuntu-latest
    environment: curseforge
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: curseforge-prepared-${{ inputs.version }}
          path: prepared
      - name: Verify optional GitHub release tag
        if: ${{ inputs.create_github_release }}
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/v${VERSION}"; then
            test "$(git rev-list -n 1 "v${VERSION}")" = "$EXPECTED_COMMIT" || { echo 'Existing tag points to a different commit'; exit 1; }
          fi
      - name: Upload approved artifact once
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          VERSION: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          GAME_VERSIONS: ${{ inputs.game_versions }}
          EXPECTED_SHA256: ${{ needs.prepare.outputs.sha256 }}
        run: |
          JAR="prepared/libs/tetra_apothic_link-${VERSION}.jar"
          python3 scripts/curseforge_release.py --version "$VERSION" --jar "$JAR" --release-type "$RELEASE_TYPE" --game-versions "$GAME_VERSIONS" --execute --expected-sha256 "$EXPECTED_SHA256"
      - name: Preserve upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curseforge-upload-receipt-${{ inputs.version }}-${{ github.run_id }}
          path: build/release/curseforge-upload-receipt.json
          if-no-files-found: ignore
      - name: Create GitHub Release
        if: ${{ inputs.create_github_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Tetra Apothic Link ${{ inputs.version }}
          files: prepared/libs/${{ needs.prepare.outputs.filename }}
          body_path: docs/release/curseforge-changelog-${{ inputs.version }}.md
          prerelease: ${{ needs.prepare.outputs.release_type != 'release' }}
