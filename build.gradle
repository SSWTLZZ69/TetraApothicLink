plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'com.matthewprenger.cursegradle' version '1.4.0'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            if (project.hasProperty('quickPlayWorld')) {
                args '--quickPlaySingleplayer', project.property('quickPlayWorld')
            }
        }
        server { args '--nogui' }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://cursemaven.com' }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation fg.deobf('maven.modrinth:mutil:6.3.0')
    implementation fg.deobf('maven.modrinth:tetra:6.17.0')
    implementation fg.deobf('curse.maven:tetrawear-670545:8570793')
    implementation fg.deobf('curse.maven:apotheosis-313970:6461960')
    implementation fg.deobf('curse.maven:placebo-283644:6274231')
    implementation fg.deobf('curse.maven:apothic-attributes-898963:5634071')
    runtimeOnly fg.deobf('curse.maven:tetracelium-929534:7913087')
    runtimeOnly fg.deobf('curse.maven:tetra-insight-1613955:8655038')
    runtimeOnly fg.deobf('curse.maven:jade-324717:6855440')
    runtimeOnly fg.deobf('curse.maven:jei-238222:8419086')

    // Create and CEI are present on the normal development classpath. They remain
    // optional for published installations through mods.toml and reflective loading.
    implementation fg.deobf('curse.maven:create-328085:7178761')
    compileOnly fg.deobf('curse.maven:create-dragons-plus-1216624:8614480')
    runtimeOnly fg.deobf('curse.maven:create-dragons-plus-1216624:8614480')
    implementation fg.deobf('curse.maven:create-enchantment-industry-688768:8616814')

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE') {
        rename { "${it}_${mod_id}" }
    }
    manifest {
        attributes([
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

curseforge {
    apiKey = providers.gradleProperty('curseForgeApiKey')
        .orElse(providers.environmentVariable('CURSEFORGE_TOKEN'))
    project {
        id = '1653941'
        releaseType = 'release'
        changelog = 'Fix compatibility with Fallen Lib: gem bonuses and bonusMap now use mutable collections instead of immutable copies, preventing UnsupportedOperationException during datapack reload when entering a world.'
        addGameVersion '1.20.1'
        addGameVersion 'Forge'
        addGameVersion 'Java 17'
        mainArtifact layout.buildDirectory.file("libs/${mod_id}-${mod_version}.jar")
    }
    options {
        javaVersionAutoDetect = false
        forgeGradleIntegration = false
        debug = false
    }
}
