<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" role="img" aria-labelledby="title desc">
  <title id="title">Tetra-style Apotheosis icon</title>
  <desc id="desc">A three-color pixel abstraction of the Apotheosis arcane seal.</desc>

  <rect width="32" height="32" fill="#000000"/>

  <!-- White upper-left structure, following the Tetra addon icon language. -->
  <g fill="#ffffff">
    <!-- Outer seal. -->
    <rect x="12" y="3" width="8" height="1"/>
    <rect x="9" y="4" width="3" height="1"/>
    <rect x="20" y="4" width="3" height="1"/>
    <rect x="7" y="5" width="2" height="1"/>
    <rect x="23" y="5" width="2" height="1"/>
    <rect x="6" y="6" width="1" height="1"/>
    <rect x="25" y="6" width="1" height="1"/>
    <rect x="5" y="7" width="1" height="2"/>
    <rect x="26" y="7" width="1" height="2"/>
    <rect x="4" y="9" width="1" height="3"/>
    <rect x="3" y="12" width="1" height="8"/>
    <rect x="4" y="20" width="1" height="3"/>
    <rect x="5" y="23" width="1" height="2"/>
    <rect x="6" y="25" width="1" height="1"/>
    <rect x="7" y="26" width="2" height="1"/>
    <rect x="9" y="27" width="3" height="1"/>
    <rect x="12" y="28" width="4" height="1"/>

    <!-- Inner seal. -->
    <rect x="13" y="9" width="6" height="1"/>
    <rect x="11" y="10" width="2" height="1"/>
    <rect x="19" y="10" width="2" height="1"/>
    <rect x="10" y="11" width="1" height="2"/>
    <rect x="9" y="13" width="1" height="6"/>
    <rect x="10" y="19" width="1" height="2"/>
    <rect x="11" y="21" width="2" height="1"/>
    <rect x="13" y="22" width="3" height="1"/>

    <!-- Cardinal and diagonal divisions. -->
    <rect x="15" y="4" width="2" height="5"/>
    <rect x="4" y="15" width="5" height="2"/>
    <rect x="8" y="8" width="1" height="1"/>
    <rect x="9" y="9" width="1" height="1"/>
    <rect x="10" y="10" width="1" height="1"/>
    <rect x="23" y="8" width="1" height="1"/>
    <rect x="22" y="9" width="1" height="1"/>
    <rect x="21" y="10" width="1" height="1"/>
    <rect x="8" y="23" width="1" height="1"/>
    <rect x="9" y="22" width="1" height="1"/>
    <rect x="10" y="21" width="1" height="1"/>

    <!-- Central Apotheosis ascension/flame glyph. -->
    <rect x="15" y="11" width="2" height="1"/>
    <rect x="14" y="12" width="1" height="3"/>
    <rect x="17" y="12" width="1" height="2"/>
    <rect x="13" y="14" width="1" height="4"/>
    <rect x="18" y="14" width="1" height="4"/>
    <rect x="14" y="18" width="1" height="2"/>
    <rect x="17" y="18" width="1" height="2"/>
    <rect x="15" y="20" width="2" height="1"/>
    <rect x="15" y="15" width="1" height="3"/>
  </g>

  <!-- Gray lower-right structure and rune fragments. -->
  <g fill="#808080">
    <!-- Outer seal. -->
    <rect x="27" y="9" width="1" height="3"/>
    <rect x="28" y="12" width="1" height="8"/>
    <rect x="27" y="20" width="1" height="3"/>
    <rect x="26" y="23" width="1" height="2"/>
    <rect x="25" y="25" width="1" height="1"/>
    <rect x="23" y="26" width="2" height="1"/>
    <rect x="20" y="27" width="3" height="1"/>
    <rect x="16" y="28" width="4" height="1"/>

    <!-- Inner seal. -->
    <rect x="21" y="11" width="1" height="2"/>
    <rect x="22" y="13" width="1" height="6"/>
    <rect x="21" y="19" width="1" height="2"/>
    <rect x="19" y="21" width="2" height="1"/>
    <rect x="16" y="22" width="3" height="1"/>

    <!-- Lower-right divisions. -->
    <rect x="23" y="15" width="5" height="2"/>
    <rect x="15" y="23" width="2" height="5"/>
    <rect x="23" y="23" width="1" height="1"/>
    <rect x="22" y="22" width="1" height="1"/>
    <rect x="21" y="21" width="1" height="1"/>

    <!-- Sparse runes, derived from Apotheosis' outer rune band. -->
    <rect x="10" y="7" width="1" height="1"/>
    <rect x="11" y="7" width="1" height="2"/>
    <rect x="21" y="7" width="2" height="1"/>
    <rect x="22" y="8" width="1" height="1"/>
    <rect x="6" y="12" width="1" height="2"/>
    <rect x="25" y="12" width="1" height="1"/>
    <rect x="6" y="20" width="2" height="1"/>
    <rect x="7" y="21" width="1" height="1"/>
    <rect x="24" y="20" width="2" height="1"/>
    <rect x="24" y="21" width="1" height="1"/>
    <rect x="10" y="24" width="1" height="1"/>
    <rect x="11" y="23" width="1" height="2"/>
    <rect x="21" y="24" width="2" height="1"/>

    <!-- Inner flame shading. -->
    <rect x="16" y="14" width="1" height="4"/>
  </g>
</svg>
